name: Azure Docs Monitor

on:
  schedule:
    - cron: '30 9 * * *' # Daily at 09:30 UTC; GitHub scheduling may be delayed
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Preview without posting to Discord or changing saved state'
        required: true
        type: boolean
        default: true
      send_test_alert:
        description: 'Send a sample alert to the DEV Discord channel'
        required: true
        type: boolean
        default: false
      send_production_test_alert:
        description: 'Send ONE clearly labeled sample alert to PRODUCTION Discord (no state changes)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: azure-docs-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitoring regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Microsoft Learn documentation
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only }}
        run: |
          if [ "$PREVIEW_ONLY" = "true" ]; then
            python src/monitor.py --preview
          else
            python src/monitor.py
          fi
      - name: Send DEV Discord test alert
        if: ${{ github.ref_name == 'dev' && github.event_name == 'workflow_dispatch' && inputs.preview_only && inputs.send_test_alert }}
        env:
          TEST_WEBHOOK: ${{ secrets.TEST_DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$TEST_WEBHOOK" ]; then
            echo "::error::Test Discord webhook secret is missing"
            exit 1
          fi

          python - <<'PY'
          import os
          import sys
          import requests

          sys.path.insert(0, "src")
          from monitor import notify, embed_for

          source = {
              "name": "Azure Virtual Desktop — What's new",
              "category": "AVD",
              "url": "https://learn.microsoft.com/en-us/azure/virtual-desktop/whats-new"
          }

          old = ["Example previous documentation text."]
          new = [
              "Example previous documentation text.",
              "SAMPLE ONLY: Azure Virtual Desktop documentation has been updated."
          ]

          embed = embed_for(source, old, new)
          embed["title"] = "TEST ONLY — Azure Documentation Updated"
          embed["footer"] = {
              "text": "DEV TEST — Synthetic documentation change"
          }

          notify(
              os.environ["TEST_WEBHOOK"],
              [embed],
              requests.Session()
          )
          print("Test embed delivered to DEV Discord.")
          PY
      - name: Send PRODUCTION Discord sample alert
        if: ${{ github.ref_name == 'dev' && github.event_name == 'workflow_dispatch' && inputs.preview_only && inputs.send_production_test_alert }}
        env:
          PRODUCTION_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$PRODUCTION_WEBHOOK" ]; then
            echo "::error::Production Discord webhook secret is missing"
            exit 1
          fi

          python - <<'PY'
          import os
          import requests

          payload = {
              "content": "🧪 **AZURE DOCS MONITOR — PRODUCTION WEBHOOK CONNECTIVITY TEST**",
              "embeds": [{
                  "title": "TEST ONLY — Production Discord Integration",
                  "description": (
                      "This is a synthetic test notification, NOT a real Microsoft Learn documentation update. "
                      "The production webhook is being verified before normal alerts are enabled."
                  ),
                  "color": 3447003,
                  "fields": [
                      {"name": "Environment", "value": "Production Discord channel", "inline": True},
                      {"name": "Monitoring state", "value": "Unchanged (preview mode)", "inline": True}
                  ],
                  "footer": {"text": "TEST ONLY — No Azure documentation change detected"}
              }]
          }
          response = requests.post(os.environ["PRODUCTION_WEBHOOK"], json=payload, timeout=20)
          response.raise_for_status()
          print("Production Discord sample notification accepted (HTTP {}).".format(response.status_code))
          PY
      - name: Commit state changes
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.preview_only) }}
        run: |
          git config user.name "azure-docs-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/pages.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Azure documentation monitor state"
            git push
          else
            echo "No documentation state changes."
          fi
